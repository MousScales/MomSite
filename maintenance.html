<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Under Maintenance — Maya African Hair Braiding</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .maintenance-bg {
            position: fixed;
            inset: 0;
            background: url('header.png') center/cover no-repeat;
            filter: blur(6px);
            transform: scale(1.05);
        }

        .maintenance-fade {
            position: fixed;
            inset: 0;
            background: rgba(26, 26, 26, 0.72);
        }

        .maintenance-content {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 1;
        }

        .maintenance-card {
            max-width: 520px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 48px 36px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
        }

        .maintenance-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: rgba(184, 134, 78, 0.2);
            border: 1px solid rgba(184, 134, 78, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .maintenance-brand {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #e8b47a;
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.75rem, 5vw, 2.25rem);
            font-weight: 600;
            line-height: 1.25;
            margin-bottom: 16px;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.88);
            margin-bottom: 28px;
        }

        .maintenance-phone {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #b8864e;
            color: #fff;
            font-size: 1.15rem;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 999px;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }

        .maintenance-phone:hover {
            background: #a37340;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="maintenance-bg" aria-hidden="true"></div>
    <div class="maintenance-fade" aria-hidden="true"></div>
    <main class="maintenance-content">
        <div class="maintenance-card">
            <div class="maintenance-icon" aria-hidden="true">&#9881;</div>
            <p class="maintenance-brand">Maya African Hair Braiding</p>
            <h1>Site Currently Under Maintenance</h1>
            <p>Online booking is temporarily unavailable. Please call us to schedule your appointment.</p>
            <a class="maintenance-phone" href="tel:+18604250751">(860) 425-0751</a>
        </div>
    </main>
</body>
</html>
